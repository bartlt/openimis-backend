# Screen: Locations: regions
# Source: openimis-fe-location_js@develop src/actions.js fetchLocations (type R)
# Variables: none (filter values are written inline in the query text, as the frontend builds it)
query GetLocations {
  locations(type: "R", orderBy: "code") {
    pageInfo { hasNextPage, hasPreviousPage, startCursor, endCursor }
    edges {
      node {
        id
        uuid
        type
        code
        name
        malePopulation
        femalePopulation
        otherPopulation
        families
        clientMutationId
      }
    }
  }
}

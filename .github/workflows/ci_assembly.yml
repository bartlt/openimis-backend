      #      --health-interval=10s 
      #      --health-interval=20s 
      #      --health-timeout=3s 
      #      --health-start-period=10s 
      #      --health-retries=10 
      #      --health-cmd="sqlcmd -S localhost -U sa -P ${SA_PASSWORD} -Q 'SELECT 1' || exit 1"
 
      pgsql:
        image: ghcr.io/openimis/openimis-pgsql:develop
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_DB: test_imis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: YourStrong!Passw0rd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            modules/*/setup.py

      - name: Install Python dependencies
        working-directory: ./script
        # apscheduler 3.10 imports pkg_resources, which setuptools 81 removed.
        run: |
          uv pip install --system "setuptools<81" -r ../requirements.txt
          python modules-requirements.py ../openimis.json > modules-requirements.txt
          uv pip install --system -r modules-requirements.txt

      - name: Environment info
        run: |
          pip list

      - name: Initialize PSQL
        # The openimis-pgsql image already ships the postgres-json-schema
        # extension; only enable it in the test database Django reuses (--keepdb).
        run: |
          PGPASSWORD="$DB_PASSWORD" psql -U $DB_USER -h $DB_HOST -d $DB_TEST_NAME \
            -c 'CREATE EXTENSION IF NOT EXISTS "postgres-json-schema"'
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_TEST_NAME: test_imis
          DB_USER: postgres
          DB_PASSWORD: YourStrong!Passw0rd

      # - name: Initialize MSSQL

      - name: Settings unit tests
        working-directory: ./openIMIS
        # Pure-stdlib unit tests for settings helpers; not collected by
        # `manage.py test <module>`, so run them explicitly.
        if: success() || failure()
        run: python openIMIS/settings/test_base_utils.py

      - name: Django tests PSQL
        working-directory: ./openIMIS
        # Run the tests regardless if previous steps failed (if setup fails the tests should crash instantly)
        if: success() || failure()
        run: |
          python -V
          export MODULES=$(jq -r '(.modules[].name)' ../openimis.json | xargs)
          MODULES=$(echo "$MODULES" | sed -E "s/\b$(echo "${CI_EXCLUDED_MODULE// /\\b|\\b}")\b/ /g" | xargs)
          echo $MODULES
          python manage.py test --keepdb $MODULES
        env:
          SECRET_KEY: secret
          MODE: DEV
          DB_DEFAULT: postgresql
          CELERY_BROKER_URL: "memory://openIMIS-test//"
          CELERY_RESULT_BACKEND: "cache+memory://openIMIS-test//"
          #DJANGO_SETTINGS_MODULE: hat.settings
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_imis
          DB_TEST_NAME: test_imis
          DB_USER: postgres
          DB_PASSWORD: YourStrong!Passw0rd
          #DEV_SERVER: true
          SITE_ROOT: api
          CI_EXCLUDED_MODULE: ${{ vars.CI_EXCLUDED_MODULE }}
          # No OpenSearch service: none of these tests query it, so only
          # disable the index sync that would otherwise try to connect.
          OPENSEARCH_DSL_AUTOSYNC: "False"

